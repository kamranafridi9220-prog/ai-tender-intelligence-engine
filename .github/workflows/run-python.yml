
name: Run AI Tender Engine

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Execute tender engine
        run: python main.py

      - name: Run classifier tests
        run: python -m unittest test_classifier.py -v

      - name: Evaluate classifier accuracy
        run: python evaluate_classifier.py
